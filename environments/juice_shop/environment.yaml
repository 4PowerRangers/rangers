name: juice_shop
description: OWASP Juice Shop CTF environment
target:
  base_url: http://rangers-juice:3000
  container: rangers-juice
  # Host-published runtime endpoint for local runs. Evaluation maps this alias
  # to base_url while retaining it under event.attributes.runtime.
  runtime_aliases: [http://127.0.0.1:3001, http://localhost:3001]
tls:
  mode: passthrough
  verify: true
observer: environments.juice_shop.observer:JuiceShopObserver
database:
  engine: sqlite
  path: /juice-shop/data/juiceshop.sqlite
  bookkeeping_tables: [Challenges]
  observation:
    mode: sequelize_udp
    bind_host: 127.0.0.1
    port: 8765
    token_env: RANGERS_DB_OBSERVER_TOKEN

# Lifecycle stage rules for evaluate.progress (S1/S2 verified against Juice
# Shop; S3-S5 are intentionally left out until this environment can produce
# events that verify them). Injected here rather than hardcoded in the
# evaluator, per the Observe/Core/Evaluate boundary: this file is the only
# place Juice-Shop-specific paths live.
lifecycle:
  progress:
    - stage: 1
      name: recon_initial_access
      when:
        kind: web
        action: request
        attributes:
          status: 200
    - stage: 2
      name: internal_expansion_goal
      when:
        kind: web
        action: request
        attributes:
          path: /rest/user/login
          status: 200
          authentication.claims.data.role: admin
